<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Política de segurança atualizada para permitir conexões necessárias-->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://cloudflare.com; connect-src 'self' https://cloudflare.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self' https://www.fesliyanstudios.com;">

    <title>Monitor de Internet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="body">
    <p>Versão: <span id="app-version">Carregando...</span></p>

    <div class="toggleable countdown" id="countdown" title="Play/Pause"></div>

    <div class="status" id="status" onclick="testarConexaoManual()"
        data-tooltip="Clique para testar a conexão manualmente">Inicializando...</div>
    <div class="toggleable status-indicator" id="statusIndicator"></div>

    <div class="toggleable log-container" id="logContainer"></div>

    <button class="toggleable config-button" id="configButton" onclick="toggleConfig()"
        title="Configurações">⚙️</button>
    <div class="toggleable config-container" id="config">
        <div class="config-group">
            <label>
                Tempo de Checagem (segundos):
                <input type="number" id="tempoChecagem" min="5" value="30">
            </label>
        </div>
        <div class="config-group">
            <label class="toggle-switch">
                <input type="checkbox" id="somNotificacao" checked>
                <span class="slider"></span>
            </label>
            <span>Ativar som da notificação</span>
        </div>
        <div class="config-group">
            <label class="toggle-switch">
                <input type="checkbox" id="notificacaoSistema" checked>
                <span class="slider"></span>
            </label>
            <span>Ativar notificações do sistema</span>
        </div>
        <div class="config-group">
            <label class="toggle-switch">
                <input type="checkbox" id="exibirTudo" checked>
                <span class="slider"></span>
            </label>
            <span>Exibir tudo</span>
        </div>
        <div class="config-group">
            <label class="toggle-switch">
                <input type="checkbox" id="logStatus" checked>
                <span class="slider"></span>
            </label>
            <span>Ativar log de status</span>
        </div>
        <div class="config-group">
            <label>
                Manter log (dias):
                <input type="number" id="manterLogDias" min="1" value="90">
            </label>
            <button onclick="confirmClearLog()" style="margin-top: 0px; background-color: rgb(218, 48, 48);">Limpar
                Log</button>
        </div>
        <button onclick="salvarConfiguracoes()"
            style="margin-top: 20px; background-color: rgb(50, 50, 218);">Salvar</button>
    </div>
    <div class="popup" id="popup"></div>

    <button class="exibir-button" id="exibirButton" onclick="toggleExibir()" title="Exibir tudo">Exibir</button>

    <button id="fullscreenButton" class="toggleable" style="position: fixed; bottom: 20px; left: 20px;"
        data-tooltip="Tela cheia">⛶</button>
    <button id="toggleVisibilityButton" class="toggleable" data-tooltip="Ocultar/Exibir tudo">👁️</button>

    <!-- Importa Scripts -->
    <script src="script.js"></script>

    <!--Processo de Renderização-->
    <script src="render.js"></script>

</body>

</html>
