<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Política de segurança atualizada para permitir conexões necessárias-->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://cloudflare.com; connect-src 'self' https://cloudflare.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self' https://www.fesliyanstudios.com;">

    <title>Monitor de Internet 1.1.3</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="body">
    <div class="toggleable countdown" id="countdown"></div>

    <div class="status" id="status" onclick="testarConexaoManual()">Inicializando...</div>

    <div class="toggleable log-container" id="logContainer"></div>

    <button class="toggleable config-button" id="configButton" onclick="toggleConfig()">⚙️</button>
    <div class="toggleable config-container" id="config">
        <div class="config-group">
            <label>
                Tempo de Checagem (segundos):
                <input type="number" id="tempoChecagem" min="5" value="30">
            </label>
        </div>
        <div class="config-group">
            <label class="checkbox-label">
                <input type="checkbox" id="somNotificacao" checked>
                Ativar som da notificação
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="exibirTudo" checked>
                Exibir tudo
            </label>
        </div>
        <div class="config-group">
            <label class="checkbox-label">
                <input type="checkbox" id="logStatus" checked>
                Ativar log de status
            </label>
            <label>
                Manter log (dias):
                <input type="number" id="manterLogDias" min="1" value="90">
            </label>
        </div>
        <button onclick="salvarConfiguracoes()">Salvar</button>
        <button onclick="confirmClearLog()" style="margin-top: 10px;">Limpar Log</button>
    </div>
    <div class="popup" id="popup"></div>

    <button class="exibir-button" id="exibirButton" onclick="toggleExibir()">Exibir</button>

    <button id="fullscreenButton" class="toggleable" style="position: fixed; bottom: 20px; left: 20px;">⛶</button>

    <!-- Importa Scripts -->
    <script src="script.js"></script>

    <!--Processo de Renderização-->
    <script src="render.js"></script>

</body>

</html>
